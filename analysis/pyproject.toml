[project]
name = "tse2026"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "polars>=1.10",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "pyyaml>=6",
  "requests>=2.32",
  "pytest>=8",
  "plotly>=5.24",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
